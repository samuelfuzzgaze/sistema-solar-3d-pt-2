<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <title>Sistema Solar 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: sans-serif; }
    #tooltip {
      position: absolute;
      background: rgba(10, 10, 20, 0.85);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      pointer-events: none;
      display: none;
      font-size: 14px;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 10;
    }
    #ui-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #888;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
  
  <!-- 1. Importação clássica das bibliotecas (resolve o ecrã preto) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="tooltip"></div>
  <div id="ui-hint">Arraste para rodar • Faça scroll para zoom • Passe o rato nos planetas</div>

  <!-- 2. O script agora corre como JavaScript normal -->
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // O OrbitControls é acedido diretamente do THREE
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminação
    scene.add(new THREE.AmbientLight(0xffffff, 0.15));
    const pointLight = new THREE.PointLight(0xffeeaa, 2, 100);
    scene.add(pointLight);

    // Fundo de Estrelas
    const starGeo = new THREE.BufferGeometry();
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.8 });
    const starVertices = [];
    for(let i=0; i<4000; i++) {
      starVertices.push((Math.random() - 0.5) * 250, (Math.random() - 0.5) * 250, (Math.random() - 0.5) * 250);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    scene.add(new THREE.Points(starGeo, starMat));

    // O Sol
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(4, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0xffcc00 })
    );
    scene.add(sun);

    // Dados dos Planetas
    const planetsData = [
      { name: 'Mercúrio', radius: 0.4, distance: 8, color: 0xaaaaaa, speed: 0.04 },
      { name: 'Vénus', radius: 0.9, distance: 12, color: 0xffcc66, speed: 0.015 },
      { name: 'Terra', radius: 1.0, distance: 16, color: 0x2266ff, speed: 0.01 },
      { name: 'Marte', radius: 0.5, distance: 20, color: 0xff4422, speed: 0.008 },
      { name: 'Júpiter', radius: 2.5, distance: 28, color: 0xcca266, speed: 0.002 },
      { name: 'Saturno', radius: 2.0, distance: 36, color: 0xeebb88, speed: 0.001, hasRings: true }
    ];

    const planets = [];

    planetsData.forEach(data => {
      // Linha da órbita
      const orbitGeo = new THREE.RingGeometry(data.distance - 0.02, data.distance + 0.02, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.15 });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);

      // Planeta
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(data.radius, 32, 32),
        new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 })
      );
      
      // Anéis de Saturno
      if (data.hasRings) {
        const ringGeo = new THREE.RingGeometry(data.radius * 1.3, data.radius * 2.2, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xccbbaa, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        mesh.add(ring);
      }

      mesh.userData = { name: data.name, distance: data.distance, speed: data.speed, angle: Math.random() * Math.PI * 2 };
      scene.add(mesh);
      planets.push(mesh);
    });

    camera.position.set(0, 30, 50);

    // Sistema de Interatividade
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');

    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(planets);

      if (intersects.length > 0) {
        tooltip.style.display = 'block';
        tooltip.style.left = event.clientX + 15 + 'px';
        tooltip.style.top = event.clientY + 15 + 'px';
        tooltip.innerHTML = `<strong>${intersects[0].object.userData.name}</strong>`;
        document.body.style.cursor = 'crosshair';
      } else {
        tooltip.style.display = 'none';
        document.body.style.cursor = 'default';
      }
    });

    // Motor de Animação
    function animate() {
      requestAnimationFrame(animate);
      
      planets.forEach(planet => {
        planet.userData.angle += planet.userData.speed;
        planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
        planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
        planet.rotation.y += 0.02;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
